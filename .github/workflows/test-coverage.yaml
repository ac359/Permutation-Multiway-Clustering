# Test coverage of R/ by the shipped tests/ suite (audit F7.5 gate: >= 90%).
# Workflow derived from r-lib/actions examples (test-coverage).
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: test-coverage

permissions: read-all

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr
          needs: coverage

      - name: Test coverage
        run: |
          cov <- covr::package_coverage(type = "tests", quiet = FALSE)
          pct <- covr::percent_coverage(cov)
          cat(sprintf("Coverage: %.2f%%\n", pct))
          if (pct < 90) stop(sprintf("Coverage %.2f%% is below the 90%% gate.", pct))
        shell: Rscript {0}
